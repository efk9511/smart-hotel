{% extends "hotel/dashboard_base.html" %}
{% block title %}Delete Room{% endblock %}
{% block dashboard_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-danger">
                <div class="card-body text-center p-4">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                    <h3>Confirm Delete</h3>
                    <p>Delete room <strong>{{ room.room_number }}</strong> ({{ room.room_type.name }})?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Delete</button>
                        <a href="{% url 'hotel:manager_rooms' %}" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
