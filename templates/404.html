{% extends "hotel/base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">404</div>
        <h2 class="fw-bold mt-3">Page Not Found</h2>
        <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
        <a href="{% url 'hotel:home' %}" class="btn btn-primary btn-lg">
            <i class="bi bi-house-door"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
