{% extends "hotel/base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">500</div>
        <h2 class="fw-bold mt-3">Server Error</h2>
        <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
        <a href="{% url 'hotel:home' %}" class="btn btn-primary btn-lg">
            <i class="bi bi-house-door"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
